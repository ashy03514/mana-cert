<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100c1a">
  <title>闇王之翼 · SS 美術樣板</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:#e6ddec; background:#100c1a; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:280px; min-height:100svh; background:radial-gradient(ellipse at 48% 30%,#49273a38,transparent 65%),linear-gradient(#100d1d,#0b0e18 75%); }
    button,a,label { -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    button { font:inherit; cursor:pointer; }
    button:disabled { cursor:default; opacity:.45; }
    button:focus-visible,a:focus-visible,input:focus-visible { outline:2px solid #c6a6de; outline-offset:4px; }
    button:hover:not(:disabled),a:hover { filter:brightness(1.14); }
    #demonWings { display:block; position:fixed; inset:0; z-index:0; width:100vw; height:100vh; pointer-events:none; }
    .shell { position:relative; z-index:1; width:min(100%,1280px); margin:auto; padding:max(12px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom)); }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:42px; }
    .eyebrow { color:#9b8da6; font-size:10px; letter-spacing:.13em; }
    .back { flex:none; padding:10px 13px; border:1px solid #c1a4d22b; border-radius:11px; color:#d9cde2; background:#171421b8; text-decoration:none; font-size:12px; }
    main { display:grid; justify-items:center; }
    .stage { position:relative; width:min(calc(100vw - 12px),640px); height:min(54svh,590px); min-height:270px; margin:0 -14px; }
    .error { position:absolute; left:9%; right:9%; top:35%; margin:0; padding:20px; border:1px solid #c3a1d33c; border-radius:14px; background:#17131fee; color:#e3d5eb; font-size:13px; line-height:1.8; }
    .error[hidden] { display:none; }
    .panel { width:min(100%,380px); text-align:center; padding-top:9px; }
    .rank { display:inline-flex; align-items:center; gap:15px; color:#c2a9cf; font-family:Georgia,serif; font-size:12px; letter-spacing:.25em; }
    .rank::before,.rank::after { content:""; width:32px; height:1px; background:linear-gradient(90deg,transparent,#b59ac25c); }
    .rank::after { transform:rotate(180deg); }
    h1 { margin:10px 0 13px; padding-left:.17em; color:#e9dff0; font-family:Georgia,"Noto Serif TC","Times New Roman",serif; font-size:clamp(28px,7vw,40px); font-weight:500; letter-spacing:.17em; text-shadow:0 0 34px #b080be22; }
    .description { margin:0 0 22px; color:#aa9bb5; font-size:12px; line-height:1.95; letter-spacing:.025em; }
    .controls { padding:12px; border:1px solid #b39ac22d; border-radius:16px; background:linear-gradient(130deg,#2c2030d9,#141522ed); box-shadow:0 14px 40px #0002; }
    .views { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .view { min-height:44px; padding:10px 8px; border:1px solid #bca2ce30; border-radius:9px; color:#c9bad4; background:#191722; font-size:12px; font-weight:600; }
    .view[aria-pressed="true"] { color:#f0e7f5; background:linear-gradient(115deg,#65455f,#3b354f); border-color:#c3a0cf52; box-shadow:0 3px 12px #0002; }
    .ornament { display:flex; justify-content:center; align-items:center; gap:9px; min-height:39px; margin-top:8px; color:#b3a2bf; font-size:12px; cursor:pointer; }
    .ornament input { width:16px; height:16px; margin:0; accent-color:#a486bd; }
    .footnote { min-height:18px; margin:13px 0 0; color:#80718d; font-size:10px; line-height:1.8; }
    @media (max-height:740px) and (orientation:portrait) {
      .shell { padding-top:8px; }
      .stage { height:49svh; min-height:235px; }
      .panel { padding-top:4px; }
      h1 { margin:6px 0 9px; font-size:28px; }
      .description { margin-bottom:15px; }
      .footnote { margin-top:9px; }
    }
    @media (max-height:620px) and (orientation:portrait) {
      .stage { height:calc(100svh - 340px); min-height:190px; }
      .description { margin-bottom:12px; font-size:11px; }
      .controls { padding:9px; }
      .ornament { min-height:32px; margin-top:5px; }
    }
    @media (min-width:650px) and (orientation:landscape) {
      .shell { min-height:100svh; display:grid; grid-template-rows:auto 1fr; }
      main { grid-template-columns:minmax(0,1fr) minmax(260px,32%); align-items:center; gap:26px; }
      .stage { width:min(100%,640px); height:min(calc(100svh - 88px),720px); min-height:240px; margin:0; }
      .panel { padding:14px 0; }
    }
    @media (min-width:650px) and (max-height:470px) {
      .shell { padding:8px 16px; }
      header { min-height:36px; }
      .stage { height:calc(100svh - 68px); min-height:220px; }
      .panel { padding:0; }
      h1 { margin:5px 0 8px; font-size:28px; }
      .description { margin-bottom:12px; font-size:11px; }
      .footnote { margin-top:8px; }
    }
  </style>
</head>
<body>
  <canvas id="demonWings" aria-label="黑藍色蝙蝠膜翼，上緣拱起，外側翼尖向下延伸，翼膜帶少量破損，鎖鏈翼飾自然垂掛"></canvas>
  <div class="shell">
    <header><span class="eyebrow">闇屬性 · SS 美術樣板</span><a class="back" href="./index.html">返回設定</a></header>
    <main>
      <div class="stage" id="stage"><p class="error" id="error" role="alert" hidden></p></div>
      <section class="panel" aria-labelledby="title">
        <div class="rank" aria-label="階級 SS">SS</div>
        <h1 id="title">闇王之翼</h1>
        <p class="description">黑藍翼膜，弧形翼骨。<br>翼尖垂落，鎖鏈隨雙翼舒展。</p>
        <div class="controls">
          <div class="views" role="group" aria-label="檢視羽翼">
            <button class="view" id="fullView" type="button" aria-pressed="true">完整構圖</button>
            <button class="view" id="detailView" type="button" aria-pressed="false">放大細節</button>
          </div>
          <label class="ornament" for="chainsToggle"><input id="chainsToggle" type="checkbox" checked><span>鎖鏈翼飾</span></label>
        </div>
        <p class="footnote" id="status" role="status">正在載入羽翼素材。</p>
      </section>
    </main>
  </div>
  <script src="./assets/dark-chain-v1.local.js"></script>
  <script src="./assets/dark-demon-wings-ss-v2.local.js"></script>
  <script src="./js/dark-demon-wing-study.js?v=117"></script>
</body>
</html>
