<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eee1bb">
  <title>羽翼成長 · A → S 樣板</title>
  <style>
    :root { color-scheme:light; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:#584321; background:#eee1bb; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:280px; min-height:100svh; background:radial-gradient(ellipse at 48% 26%,#fffef4,transparent 60%),linear-gradient(#e6d29b,#f5eedb 70%,#eee0bb); }
    button,a { -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    button { font:inherit; cursor:pointer; }
    button:focus-visible,a:focus-visible { outline:2px solid #806023; outline-offset:4px; }
    button:hover { filter:brightness(1.04); }
    #angel { display:block; position:fixed; z-index:0; inset:0; width:100vw; height:100vh; pointer-events:none; }
    .shell { position:relative; z-index:1; max-width:1360px; margin:auto; padding:max(12px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom)); }
    header { display:flex; justify-content:space-between; align-items:center; gap:12px; position:relative; z-index:1; min-height:40px; }
    .eyebrow { color:#74613d; font-size:10px; letter-spacing:.14em; }
    .back { padding:9px 12px; border:1px solid #9e7c3a45; border-radius:10px; background:#fffaf0cf; color:#604b28; font-size:12px; text-decoration:none; white-space:nowrap; box-shadow:0 3px 12px #8766300a; }
    main { display:grid; justify-items:center; }
    .stage { position:relative; width:calc(100vw - 8px); max-width:740px; height:min(53svh,570px); min-height:260px; margin:0 -14px; }
    .error { position:absolute; inset:26% 10%; margin:0; padding:22px; border:1px solid #a582454d; border-radius:14px; background:#fff9eaed; color:#634a26; font-size:13px; line-height:1.8; }
    .error[hidden] { display:none; }
    .panel { width:min(100%,400px); text-align:center; }
    .rank { display:inline-flex; align-items:center; gap:13px; color:#886621; font-family:Georgia,serif; font-size:12px; letter-spacing:.28em; }
    .rank::before,.rank::after { content:""; width:31px; height:1px; background:linear-gradient(90deg,transparent,#94702f80); }
    .rank::after { rotate:180deg; }
    h1 { font-family:Georgia,"Noto Serif TC","Times New Roman",serif; font-size:clamp(28px,7vw,38px); font-weight:500; letter-spacing:.18em; margin:8px 0 10px; padding-left:.18em; color:#584321; text-shadow:0 1px 9px #fff8df88; }
    .description { color:#746143; font-size:12px; line-height:1.9; margin:0 0 18px; }
    .controls { padding:14px; border:1px solid #a6894b40; border-radius:17px; background:linear-gradient(140deg,#fffdf5de,#f8eed5e8); box-shadow:0 14px 40px #73562312,inset 0 1px 0 #fffdf6; text-align:left; }
    .playback { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .control { min-height:42px; border:1px solid #b394574d; border-radius:9px; background:#fffdf5c9; color:#634d28; font-size:13px; font-weight:600; }
    .control.primary { background:linear-gradient(110deg,#ad8845,#8b672c); border-color:#987335; color:#fffaf0; box-shadow:0 3px 10px #89612814,inset 0 1px 0 #e8d4a44d; }
    .adjustments { display:grid; grid-template-columns:auto 1fr; align-items:center; gap:14px; margin-top:12px; }
    .label { color:#78613b; font-size:11px; }
    .speeds { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; }
    .speed { border:1px solid transparent; border-radius:7px; background:transparent; color:#7b6848; padding:7px 8px; font-size:12px; }
    .speed[aria-pressed="true"] { color:#654817; background:#b28a3917; border-color:#a481384d; }
    .phases { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; padding-top:12px; margin-top:11px; border-top:1px solid #ad90492b; }
    .phase { min-height:35px; padding:5px 3px; border:1px solid #b3945740; border-radius:7px; background:#fffbefb3; color:#765c31; font-size:11px; }
    .phase[aria-pressed="true"] { color:#634414; border-color:#a57b3780; background:#d5b46826; }
    .footnote { min-height:17px; margin:11px 0 0; color:#7f6b49; font-size:10px; line-height:1.7; }
    @media (max-height:740px) and (orientation:portrait) { .shell { padding-top:8px; } .stage { height:46svh; min-height:225px; } h1 { margin:4px 0 6px; font-size:28px; } .description { margin-bottom:12px; } .controls { padding:11px; } .footnote { margin-top:8px; } }
    @media (max-height:650px) and (orientation:portrait) { .stage { height:calc(100svh - 354px); min-height:185px; } .description { font-size:11px; } .adjustments { margin-top:8px; } .phases { margin-top:8px; padding-top:9px; } }
    @media (min-width:650px) and (orientation:landscape) { .shell { min-height:100svh; display:grid; grid-template-rows:auto 1fr; } main { grid-template-columns:minmax(0,1fr) minmax(265px,34%); gap:28px; align-items:center; } .stage { width:100%; max-width:none; height:min(calc(100svh - 88px),760px); min-height:245px; margin:0; } .panel { padding:12px 0; } }
    .stage { height:min(45svh,480px); min-height:220px; }
    .scrub { margin-top:14px; color:#78613b; font-size:12px; }
    .scrub label { display:flex; justify-content:space-between; }
    .scrub input { width:100%; margin:10px 0 0; accent-color:#a6813c; cursor:pointer; }
    @media(max-height:700px) and (orientation:portrait) { .stage { height:calc(100svh - 400px); min-height:150px; } .description { margin-bottom:8px; } .scrub { margin-top:8px; } }
    @media(min-width:650px) and (orientation:landscape) { .stage { height:calc(100svh - 88px); min-height:245px; } }
  </style>
</head>
<body>
  <canvas id="angel" aria-label="幼翼的肩羽、飛羽與尾羽逐層展開，成長為 S 級羽翼"></canvas>
  <div class="shell">
    <header><span class="eyebrow">光屬性 · 羽翼成長樣板</span><a class="back" href="./index.html?v=103">返回設定</a></header>
    <main>
      <div class="stage" id="stage"><p class="error" id="error" role="alert" hidden></p></div>
      <section class="panel" aria-labelledby="title">
        <div class="rank" aria-label="A 級成長為 S 級">A → S</div>
        <h1 id="title">羽翼初成</h1>
        <p class="description">光沿羽化交界流動，新羽於聖光中展開。<br>形體完整後，光暈漸退，羽色浮現。</p>
        <div class="controls">
          <div class="playback">
            <button id="pause" class="control primary" type="button" aria-pressed="false">暫停</button>
            <button id="replay" class="control" type="button">重新播放</button>
          </div>
          <div class="adjustments">
            <span class="label" id="speedLabel">播放速度</span>
            <div class="speeds" role="group" aria-labelledby="speedLabel">
              <button class="speed" data-speed="0.25" aria-pressed="false" type="button">0.25×</button>
              <button class="speed" data-speed="0.5" aria-pressed="false" type="button">0.5×</button>
              <button class="speed" data-speed="1" aria-pressed="true" type="button">1×</button>
            </div>
          </div>
          <div class="scrub"><label for="progress">成長進度 <output id="progressValue">0%</output></label><input id="progress" type="range" min="0" max="1000" value="0" step="1"></div>
          <div class="phases" role="group" aria-label="定格觀察羽翼成長">
            <button class="phase" data-progress="0" aria-pressed="false" type="button">A 級幼翼</button>
            <button class="phase" data-progress="0.4" aria-pressed="false" type="button">羽化光流</button>
            <button class="phase" data-progress="0.7272727272727273" aria-pressed="false" type="button">高光成形</button>
            <button class="phase" data-progress="1" aria-pressed="false" type="button">恢復原色</button>
          </div>
        </div>
        <p class="footnote" id="status" role="status">正在載入羽翼素材。</p>
      </section>
    </main>
  </div>
  <script src="./js/light-holy-shader.js"></script>
  <script src="./js/fire-rank-sparkles.js"></script>
  <script src="./assets/light-angel-wings-v1.local.js"></script>
  <script src="./assets/light-angel-wings-ranks.local.js"></script>
  <script src="./js/light-angel-motion.js"></script>
  <script src="./js/light-angel-motion-renderer.js"></script>
  <script src="./js/light-angel-layered-growth-renderer.js"></script>
  <script src="./js/light-angel-growth-study.js"></script>
</body>
</html>
