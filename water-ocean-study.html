<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04131e">
  <title>水之星球 · SS 動畫樣板</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui,-apple-system,"Segoe UI",sans-serif; color: #d9f7ff; background: #03121c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; min-height: 100svh; background: radial-gradient(ellipse at 50% 13%,#0a2a3b66,transparent 55%),linear-gradient(#041621,#020d16 58%,#06202e); }
    button,input,a { -webkit-tap-highlight-color: transparent; }
    button,a { touch-action: manipulation; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible,a:focus-visible,input:focus-visible { outline: 2px solid #b5f3ff; outline-offset: 4px; }
    .waterfall { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .waterfall::before,.waterfall::after { content:""; position:absolute; inset:-65% -10% 0; opacity:.25; background: repeating-linear-gradient(90deg,transparent 0 3%,#1e8bb00d 4%,#4ed4fc28 4.5%,transparent 6% 12%); filter:blur(9px); mask-image:linear-gradient(transparent,#000 35%,transparent 74%); animation:fall 7s linear infinite; }
    .waterfall::after { left:8%; opacity:.17; animation-delay:-3.7s; animation-duration:9s; transform:scaleX(-1); }
    @keyframes fall { from { translate:0 -30%; } to { translate:0 56%; } }
    body[data-still="true"] .waterfall::before,body[data-still="true"] .waterfall::after { animation-play-state:paused; }
    .shell { position:relative; z-index:1; max-width:960px; margin:auto; padding: max(12px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom)); }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; position:relative; z-index:1; min-height:40px; }
    .eyebrow { color:#87adbd; font-size:11px; letter-spacing:.16em; }
    .back { padding:9px 12px; border:1px solid #b6e9ff25; border-radius:11px; background:#071621a8; color:#c2dce7; font-size:13px; text-decoration:none; }
    main { display:grid; justify-items:center; }
    .stage { width:min(calc(100vw - 12px),62svh,640px); aspect-ratio:1; margin:0 -8px; position:relative; }
    canvas { display:block; width:100%; height:100%; }
    .error { position:absolute; inset:25% 10%; margin:0; padding:24px; background:#071a29ef; border:1px solid #5bafca55; border-radius:16px; color:#c9e2ed; font-size:14px; line-height:1.7; }
    .error[hidden] { display:none; }
    .panel { width:min(100%,440px); text-align:center; }
    .rank { display:inline-flex; align-items:center; gap:10px; color:#a9e9fa; font-size:11px; letter-spacing:.24em; }
    .rank::before,.rank::after { content:""; width:24px; height:1px; background:linear-gradient(90deg,transparent,#80cee666); }
    .rank::after { rotate:180deg; }
    h1 { font-family:Georgia,"Noto Serif TC","Times New Roman",serif; font-weight:500; font-size:clamp(25px,6.5vw,35px); letter-spacing:.15em; margin:6px 0 10px; }
    .description { font-size:12px; line-height:1.8; color:#83a9bb; margin:0 auto 18px; max-width:320px; }
    .controls { background:linear-gradient(145deg,#102b3a99,#061724d9); border:1px solid #abdff21c; border-radius:19px; padding:13px; box-shadow:0 12px 40px #0003; text-align:left; }
    .playback { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .control { min-height:42px; border:1px solid #a5e9ff24; border-radius:11px; color:#c9eaf3; background:#0b2432; font-size:13px; font-weight:600; }
    .control.primary { background:linear-gradient(110deg,#22637b,#154354); border-color:#8edffb38; color:#eafaff; }
    .adjustments { display:grid; grid-template-columns:auto 1fr; align-items:center; gap:11px 14px; margin-top:14px; }
    .label { font-size:11px; color:#91b3c2; white-space:nowrap; }
    .speeds { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; }
    .speed { border:1px solid transparent; color:#8eafbf; background:transparent; padding:6px 8px; border-radius:8px; font-size:12px; }
    .speed[aria-pressed="true"] { color:#d6f6ff; background:#70ceef13; border-color:#70ceef2e; }
    .surge { display:flex; align-items:center; gap:10px; }
    input[type="range"] { width:100%; accent-color:#8ed7eb; height:20px; margin:0; }
    output { min-width:31px; font-size:11px; color:#91b3c2; text-align:right; font-variant-numeric:tabular-nums; }
    .footnote { margin:11px 0 0; min-height:16px; color:#648899; font-size:10px; line-height:1.6; }
    @media (max-height:720px) and (orientation:portrait) { .stage { width:min(calc(100vw - 16px),41svh); } .description { margin-bottom:12px; } h1 { margin:4px 0 5px; font-size:25px; } .controls { padding:10px; } .adjustments { margin-top:10px; gap:7px 10px; } .shell { padding-top:8px; } }
    @media (min-width:650px) and (orientation:landscape) { .shell { min-height:100svh; display:grid; grid-template-rows:auto 1fr; } main { grid-template-columns:minmax(0,1fr) minmax(260px,35%); gap:20px; align-items:center; } .stage { width:min(58vw,calc(100svh - 84px),620px); } .panel { padding-right:8px; } h1 { font-size:29px; } .description { max-width:270px; } }
    @media (prefers-reduced-motion:reduce) { .waterfall::before,.waterfall::after { animation:none; } }
  </style>
</head>
<body>
  <div class="waterfall" aria-hidden="true"></div>
  <div class="shell">
    <header>
      <span class="eyebrow">水屬性 · SS 動畫樣板</span>
      <a class="back" href="./index.html">返回設定</a>
    </header>
    <main>
      <div class="stage" id="stage">
        <canvas id="ocean" aria-label="具有湧浪、細碎白沫與天空反光的海洋星球"></canvas>
        <p class="error" id="error" role="alert" hidden></p>
      </div>
      <section class="panel" aria-labelledby="title">
        <div class="rank" aria-label="階級 SS">SS</div>
        <h1 id="title">水之星球</h1>
        <p class="description">深海藍的湧浪與細碎白沫，<br>水面隨波反射天空的光。</p>
        <div class="controls">
          <div class="playback">
            <button id="pause" class="control primary" type="button" aria-pressed="false">暫停</button>
            <button id="replay" class="control" type="button">重新播放</button>
          </div>
          <div class="adjustments">
            <span class="label" id="speedLabel">播放速度</span>
            <div class="speeds" role="group" aria-labelledby="speedLabel">
              <button class="speed" data-speed="0.5" aria-pressed="false" type="button">0.5×</button>
              <button class="speed" data-speed="1" aria-pressed="true" type="button">1×</button>
              <button class="speed" data-speed="1.5" aria-pressed="false" type="button">1.5×</button>
            </div>
            <label class="label" for="surge">海面風浪</label>
            <div class="surge"><input id="surge" type="range" min="0" max="100" value="100"><output id="surgeValue" for="surge">100%</output></div>
          </div>
        </div>
        <p class="footnote" id="status" role="status">SS 美術預覽 · 不產生鑑定結果</p>
      </section>
    </main>
  </div>
  <script src="./js/ocean-surface-shader.js"></script>
  <script src="./js/ocean-spray-field.js"></script>
  <script src="./js/ocean-spray.js"></script>
  <script src="./js/water-ocean-study.js"></script>
  <script src="./js/water-rank-effects.js"></script>
  <script>
    (()=>{
      'use strict';
      const canvas=document.querySelector('#ocean'),stage=document.querySelector('#stage');
      const pauseButton=document.querySelector('#pause'),status=document.querySelector('#status'),error=document.querySelector('#error');
      let renderer=null,time=0,speed=1,surge=1,paused=false,hidden=document.hidden,last=null,raf=0,disposed=false,failed=false;
      function fail(message){
        failed=true;error.hidden=false;error.textContent='目前無法顯示水之星球，請重新整理後再試。';
        status.textContent='特效暫時無法顯示';console.error(message);
      }
      function draw(){
        if(disposed||failed||!renderer)return;
        try{
          const result=renderer.draw(time,{surge});
          if(result===false||renderer.error)fail(renderer.diagnostic||renderer.error||'Unable to draw ocean.');
        }catch(problem){fail(problem);}
      }
      function state(){
        document.body.dataset.still=String(paused||hidden);
        pauseButton.textContent=paused?'繼續播放':'暫停';pauseButton.setAttribute('aria-pressed',String(paused));
        if(!failed)status.textContent=paused?'已暫停 · 可調整強度或播放速度':'SS 美術預覽 · 不產生鑑定結果';
      }
      function setPaused(value=true){paused=Boolean(value);last=null;state();return paused;}
      function resize(){
        if(!renderer||disposed)return;
        const rect=stage.getBoundingClientRect();
        renderer.resize(Math.max(1,rect.width),Math.max(1,rect.height),Math.min(2,window.devicePixelRatio||1));draw();
      }
      function tick(now){
        if(disposed)return;
        if(!paused&&!hidden){
          if(last!==null)time+=Math.min(.05,Math.max(0,(now-last)/1000))*speed;
          draw();
        }
        last=paused||hidden?null:now;raf=requestAnimationFrame(tick);
      }
      pauseButton.addEventListener('click',()=>setPaused(!paused));
      document.querySelector('#replay').addEventListener('click',()=>{time=0;setPaused(false);draw();});
      document.querySelectorAll('[data-speed]').forEach(button=>button.addEventListener('click',()=>{
        speed=Number(button.dataset.speed);last=null;
        document.querySelectorAll('[data-speed]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
      }));
      document.querySelector('#surge').addEventListener('input',event=>{
        surge=Number(event.target.value)/100;document.querySelector('#surgeValue').textContent=Math.round(surge*100)+'%';draw();
      });
      document.addEventListener('visibilitychange',()=>{hidden=document.hidden;last=null;state();});
      addEventListener('pagehide',()=>{hidden=true;last=null;state();});
      addEventListener('pageshow',()=>{hidden=document.hidden;last=null;state();draw();});
      addEventListener('resize',resize);
      window.waterOceanStudy={
        get renderer(){return renderer;},get time(){return time;},get paused(){return paused;},get speed(){return speed;},
        get status(){return failed?'error':paused?'paused':hidden?'hidden':'playing';},
        renderAt(value){setPaused(true);time=Math.max(0,Number(value)||0);draw();return time;},
        pause:setPaused,resize,
        dispose(){disposed=true;cancelAnimationFrame(raf);renderer?.dispose();}
      };
      try{renderer=new WaterOceanStudy(canvas);resize();state();renderer.ready.then(draw);raf=requestAnimationFrame(tick);}catch(problem){fail(problem);}
    })();
  </script>
</body>
</html>
